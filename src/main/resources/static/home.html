<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Servicio Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { overflow-x: hidden; }
        
        /* Estilo de la Barra Lateral */
        .sidebar {
            min-height: 100vh;
            width: 250px;
            background-color: #212529;
            transition: all 0.3s;
        }

        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background-color: #343a40;
            color: white;
            border-left: 4px solid #0d6efd;
        }

        .sidebar a.active {
            background-color: #0d6efd;
            color: white;
        }

        /* Área de Contenido Principal */
        .content-area {
            flex: 1;
            background-color: #f8f9fa;
        }

        .user-badge { font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- BARRA LATERAL (MENU IZQUIERDO) -->
    <nav class="sidebar shadow">
        <div class="p-3 text-white border-bottom border-secondary">
            <h5 class="mb-0 text-center">Servicio Médico</h5>
        </div>
        <div class="mt-3">
            <small class="text-uppercase px-4 text-muted" style="font-size: 0.7rem;">Módulos</small>
            <a th:href="@{/home}" class="active"><i class="bi bi-speedometer2 me-2"></i> Inicio</a>
            <a th:href="@{/lotes}"><i class="bi bi-hospital me-2"></i> Gestión Médica</a>
            <a th:href="@{/facturas}"><i class="bi bi-box-seam me-2"></i> Inventario</a>
            <a th:href="@{/maestros}"><i class="bi bi-box-seam me-2"></i> Tablas Maestras</a>
            <!-- En la barra lateral -->
            <!-- Cambia la línea 62 de tu imagen a esto -->
            <a href="#" onclick="cargarContenido('/maestros/medicos.html')">
            <i class="bi bi-person-badge me-2"></i> Médicos
            </a>
            <a th:href="@{/reportes}"><i class="bi bi-file-earmark-pdf me-2"></i> Reportes</a>
        </div>
        
        <div class="mt-5 px-3">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                    <i class="bi bi-box-arrow-left"></i> Salir
                </button>
            </form>
        </div>
    </nav>

    <!-- AREA CENTRAL (FORMULARIOS Y CONTENIDO) -->
    <main class="content-area">
        <!-- Header superior dentro del contenido -->
        <header class="navbar navbar-light bg-white shadow-sm px-4 py-2 mb-4">
            <span class="navbar-text text-dark fw-bold">Panel de Control</span>
            <span class="user-badge text-secondary" th:text="'Usuario: ' + ${usuario}">Usuario</span>
        </header>

        <div class="container-fluid px-4">
            <!-- Aquí es donde se cargarán tus formularios o el resumen -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="card-title text-secondary mb-4">Bienvenido al Sistema</h4>
                    <p class="text-muted">Seleccione una opción del menú izquierdo para comenzar a trabajar.</p>
                    
                    <!-- ESPACIO PARA TUS FORMULARIOS -->
                    <div id="formulario-contenedor" class="mt-4 p-4 border rounded bg-white">
                        <p class="text-center text-muted italic">El formulario seleccionado aparecerá en este espacio.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
    
    <script>
    function cargarContenido(ruta) {
    // 1. Buscamos el hueco en el centro del dashboard
    const contenedor = document.getElementById('formulario-contenedor');
    
    // 2. Traemos el HTML del archivo (ej: medicos.html)
    fetch(ruta)
        .then(response => response.text())
        .then(html => {
            // 3. Lo metemos en el centro
            contenedor.innerHTML = html;
            
            // 4. Si el archivo tiene una función para cargar la tabla, la ejecutamos
            if (ruta.includes('medicos')) fetchMedicos();
        });
    }
    </script>
    
    
    
</body>
</html>
